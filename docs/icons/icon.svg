<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Gym Wecker: Stoppuhr mit Hantel, weiß auf Orange-Pink-Verlauf -->
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFA526"/>
      <stop offset="0.55" stop-color="#FF6A3D"/>
      <stop offset="1" stop-color="#FF3B5C"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF1EA"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#gloss)"/>

  <g filter="url(#lift)" fill="url(#glyph)">
    <!-- Krone der Stoppuhr -->
    <rect x="462" y="168" width="100" height="56" rx="18"/>
    <rect x="494" y="214" width="36" height="40" rx="8"/>
    <!-- Ring -->
    <circle cx="512" cy="566" r="292" fill="none" stroke="url(#glyph)" stroke-width="64"/>
    <!-- Hantel -->
    <g transform="translate(512 566) scale(0.9) translate(-512 -566)">
      <rect x="362" y="538" width="300" height="56" rx="28"/>
      <rect x="314" y="462" width="70" height="208" rx="28"/>
      <rect x="640" y="462" width="70" height="208" rx="28"/>
      <rect x="256" y="498" width="54" height="136" rx="24"/>
      <rect x="714" y="498" width="54" height="136" rx="24"/>
    </g>
  </g>
</svg>
